<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Tumi 💛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #F3E9EE; --ink: #2E2A3B; --soft: #5E5873; --card: #FFFFFF;
    --btn: #2E2A3B; --btn-ink: #FFFFFF; --dot: #D9D2E0; --dot-on: #E0607E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #1D1A24; --ink: #F5F0FA; --soft: #C0B8D2; --card: #2A2634; --btn: #FFC857; --btn-ink: #2E2A3B; --dot: #4A4458; }
  }
  :root[data-theme="dark"] { --page: #1D1A24; --ink: #F5F0FA; --soft: #C0B8D2; --card: #2A2634; --btn: #FFC857; --btn-ink: #2E2A3B; --dot: #4A4458; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card { position: relative; width: 100%; max-width: 400px; background: var(--card); border-radius: 28px; overflow: hidden; box-shadow: 0 18px 40px -18px rgba(46,42,59,.45); }
  svg { display: block; width: 100%; height: auto; }
  .text { padding: 18px 24px 22px; text-align: center; min-height: 210px; display: flex; flex-direction: column; align-items: center; }
  .dots { display: flex; gap: 7px; margin-bottom: 12px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); transition: background .4s, transform .4s; }
  .dots span.on { background: var(--dot-on); transform: scale(1.25); }
  h1 { font-size: 1.55rem; font-weight: 600; margin: 0 0 6px; line-height: 1.2; }
  p { margin: 0 0 16px; color: var(--soft); font-size: 1.05rem; line-height: 1.45; max-width: 30ch; }
  .sig { font-family: "Caveat", "Comic Sans MS", cursive; font-size: 1.7rem; color: var(--ink); margin: -4px 0 12px; }
  .row { display: flex; gap: 10px; margin-top: auto; }
  button { font: inherit; font-weight: 500; font-size: 1.02rem; background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer; transition: transform .15s ease; }
  button:active { transform: scale(.95); }
  button:focus-visible { outline: 3px solid #FFB4C8; outline-offset: 3px; }
  .ghost { background: transparent; color: var(--soft); padding: 12px 14px; }
  .hidden { display: none !important; }
  .swap { animation: fadeIn .6s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* scene engine */
  #sky { transition: fill 1.2s ease; }
  #ground { transition: fill 1.2s ease; }
  .char { transition: transform 1.4s cubic-bezier(.45,.05,.3,1); }
  #me { transform: translate(100px, 300px); }
  #her { transform: translate(260px, 300px); }
  [data-s="2"] #me { transform: translate(152px, 300px); }
  [data-s="2"] #her { transform: translate(208px, 300px); }
  [data-s="3"] #me { transform: translate(78px, 300px); }
  [data-s="3"] #her { transform: translate(286px, 300px); }
  [data-s="4"] #me, [data-s="5"] #me { transform: translate(140px, 300px); }
  [data-s="4"] #her, [data-s="5"] #her { transform: translate(262px, 300px); }
  .hugged #me { transform: translate(166px, 300px) !important; }
  .hugged #her { transform: translate(196px, 300px) !important; }

  [data-s="2"] .bob { animation: walk .5s ease-in-out infinite alternate; }
  #her .bob { animation-delay: .25s; }
  .hugged .bob { animation: sway 1.6s ease-in-out infinite alternate; }
  @keyframes walk { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  @keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }

  .head { transition: transform 1s ease; transform-box: view-box; }
  [data-s="3"] #me .head { transform: rotate(10deg) translate(4px, 4px); transform-origin: 0 -70px; }

  .happy, .sad { transition: opacity .6s ease; }
  .sad { opacity: 0; }
  [data-s="3"] .happy { opacity: 0; } [data-s="3"] .sad { opacity: 1; }
  [data-s="4"] #me .happy, [data-s="5"]:not(.hugged) #me .happy { opacity: 0; }
  [data-s="4"] #me .sad, [data-s="5"]:not(.hugged) #me .sad { opacity: 1; }
  [data-s="4"] #her .happy { opacity: 0; } [data-s="4"] #her .sad { opacity: .9; }

  .prop { opacity: 0; transition: opacity .9s ease; pointer-events: none; }
  [data-s="1"] .p1, [data-s="2"] .p2, [data-s="3"] .p3, [data-s="4"] .p4, [data-s="5"] .p4,
  [data-s="5"] .p5 { opacity: 1; }
  .hugged .flower { opacity: 0 !important; }
  .hugarms { opacity: 0; transition: opacity .5s ease 1.1s; }
  .hugged .hugarms { opacity: 1; }
  .hugged .loosearm { opacity: 0; transition: opacity .3s ease 1s; }

  .smoke { animation: smoke 2.6s ease-in-out infinite; opacity: 0; }
  .smoke:nth-child(2) { animation-delay: .9s; } .smoke:nth-child(3) { animation-delay: 1.7s; }
  @keyframes smoke { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: .7; } 100% { transform: translateY(-30px); opacity: 0; } }
  .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 1.6s ease-in-out infinite; }
  .twinkle:nth-child(2) { animation-delay: .5s; } .twinkle:nth-child(3) { animation-delay: 1s; }
  @keyframes twinkle { 0%,100% { transform: scale(.4); opacity: .3; } 50% { transform: scale(1.1); opacity: 1; } }
  .trees { animation: scroll 6s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-360px); } }
  .lilheart { animation: rise 2.4s ease-out infinite; opacity: 0; }
  .lilheart:nth-child(2) { animation-delay: .8s; } .lilheart:nth-child(3) { animation-delay: 1.6s; }
  @keyframes rise { 0% { transform: translateY(0) scale(.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-50px) scale(1); opacity: 0; } }
  .drop { animation: rain .9s linear infinite; }
  .drop:nth-child(2n) { animation-delay: .3s; } .drop:nth-child(3n) { animation-delay: .6s; }
  @keyframes rain { from { transform: translateY(0); opacity: 1; } to { transform: translateY(60px); opacity: 0; } }

  .heart { position: absolute; pointer-events: none; font-size: 24px; animation: floatUp 2.8s ease-out forwards; }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(.4); opacity: 0; }
    15% { opacity: 1; transform: translateY(-20px) scale(1); }
    100% { transform: translateY(-260px) translateX(var(--dx)) scale(.9); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .3s !important; }
  }
</style>
</head>
<body>
<main class="card" id="card">
  <svg id="scene" data-s="1" viewBox="0 0 360 360" role="img" aria-label="A short animated story of Ano and Tumi">
    <rect id="sky" width="360" height="360" fill="#FFC9A0"/>

    <!-- scene 2: sun + scrolling trees -->
    <g class="prop p2">
      <circle cx="300" cy="62" r="28" fill="#FFD166"/>
      <g class="trees">
        <g fill="#6DBE8A">
          <circle cx="30" cy="236" r="26"/><circle cx="130" cy="230" r="32"/><circle cx="250" cy="238" r="24"/><circle cx="330" cy="232" r="28"/>
          <circle cx="390" cy="236" r="26"/><circle cx="490" cy="230" r="32"/><circle cx="610" cy="238" r="24"/><circle cx="690" cy="232" r="28"/>
        </g>
        <g fill="#7A5A3C">
          <rect x="26" y="258" width="8" height="42"/><rect x="126" y="258" width="8" height="42"/><rect x="246" y="258" width="8" height="42"/><rect x="326" y="258" width="8" height="42"/>
          <rect x="386" y="258" width="8" height="42"/><rect x="486" y="258" width="8" height="42"/><rect x="606" y="258" width="8" height="42"/><rect x="686" y="258" width="8" height="42"/>
        </g>
      </g>
    </g>

    <!-- scene 3: rain cloud -->
    <g class="prop p3">
      <g stroke="#E6ECF5" stroke-width="3" stroke-linecap="round">
        <line class="drop" x1="120" y1="96" x2="116" y2="108"/><line class="drop" x1="150" y1="100" x2="146" y2="112"/>
        <line class="drop" x1="180" y1="96" x2="176" y2="108"/><line class="drop" x1="210" y1="100" x2="206" y2="112"/>
        <line class="drop" x1="240" y1="96" x2="236" y2="108"/><line class="drop" x1="135" y1="104" x2="131" y2="116"/>
        <line class="drop" x1="225" y1="104" x2="221" y2="116"/>
      </g>
      <ellipse cx="180" cy="78" rx="80" ry="24" fill="#D2D8E3"/>
      <circle cx="150" cy="64" r="28" fill="#D2D8E3"/><circle cx="198" cy="54" r="34" fill="#D2D8E3"/>
    </g>

    <!-- scene 4/5: soft sun peeking -->
    <g class="prop p4">
      <circle cx="60" cy="70" r="22" fill="#FFE29A" opacity=".85"/>
    </g>

    <rect id="ground" y="298" width="360" height="62" fill="#C98F6B"/>

    <!-- scene 1: braai + sparkles -->
    <g class="prop p1">
      <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
        <path class="smoke" d="M170 240 q-6 -10 0 -20 q6 -10 0 -20"/>
        <path class="smoke" d="M182 238 q-6 -10 0 -20 q6 -10 0 -20"/>
        <path class="smoke" d="M194 240 q-6 -10 0 -20 q6 -10 0 -20"/>
      </g>
      <line x1="166" y1="270" x2="158" y2="300" stroke="#3A3A3A" stroke-width="4" stroke-linecap="round"/>
      <line x1="194" y1="270" x2="202" y2="300" stroke="#3A3A3A" stroke-width="4" stroke-linecap="round"/>
      <path d="M150 250 h60 a30 22 0 0 1 -60 0 z" fill="#3A3A3A"/>
      <rect x="160" y="244" width="40" height="7" rx="3.5" fill="#B5543A"/>
      <g fill="#FFFFFF">
        <path class="twinkle" d="M180 150 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z"/>
        <path class="twinkle" d="M150 175 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
        <path class="twinkle" d="M210 172 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
      </g>
    </g>

    <!-- scene 2: little hearts above the pair -->
    <g class="prop p2" fill="#FF7A9C">
      <path class="lilheart" d="M180 176 l-7 -7 a4.5 4.5 0 0 1 7 -5.5 a4.5 4.5 0 0 1 7 5.5 z"/>
      <path class="lilheart" d="M166 186 l-5 -5 a3.2 3.2 0 0 1 5 -4 a3.2 3.2 0 0 1 5 4 z"/>
      <path class="lilheart" d="M196 184 l-5 -5 a3.2 3.2 0 0 1 5 -4 a3.2 3.2 0 0 1 5 4 z"/>
    </g>

    <!-- scene 3: crack between them -->
    <path class="prop p3" d="M182 298 l-8 14 l10 10 l-8 14 l8 12 l-6 12" stroke="#5A4A44" stroke-width="3" fill="none" stroke-linejoin="round"/>

    <!-- ME -->
    <g id="me" class="char">
      <g class="bob">
        <rect x="-12" y="-36" width="9" height="36" rx="4" fill="#2E3A55"/>
        <rect x="3" y="-36" width="9" height="36" rx="4" fill="#2E3A55"/>
        <rect x="-20" y="-72" width="40" height="42" rx="14" fill="#4A7BD0"/>
        <path d="M-18 -64 q-12 14 -9 30" stroke="#4A7BD0" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path class="loosearm" d="M18 -64 q12 14 9 30" stroke="#4A7BD0" stroke-width="8" fill="none" stroke-linecap="round"/>
        <!-- flower he holds -->
        <g class="prop p4 flower">
          <line x1="28" y1="-34" x2="30" y2="-64" stroke="#5DAA6A" stroke-width="3" stroke-linecap="round"/>
          <g transform="translate(30 -70)">
            <circle cx="0" cy="-6" r="5" fill="#FF8FAB"/><circle cx="6" cy="0" r="5" fill="#FF8FAB"/>
            <circle cx="0" cy="6" r="5" fill="#FF8FAB"/><circle cx="-6" cy="0" r="5" fill="#FF8FAB"/>
            <circle r="4" fill="#FFD166"/>
          </g>
        </g>
        <g class="head">
          <circle cx="0" cy="-92" r="22" fill="#7A4B2E"/>
          <path d="M-21 -97 q2 -21 21 -22 q19 1 21 22 q-10 -9 -21 -8 q-11 -1 -21 8 z" fill="#1F1510"/>
          <g class="happy">
            <circle cx="-8" cy="-91" r="2.6" fill="#1F1510"/><circle cx="8" cy="-91" r="2.6" fill="#1F1510"/>
            <path d="M-7 -82 q7 7 14 0" stroke="#1F1510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <circle cx="-14" cy="-84" r="3.5" fill="#FF9EB5" opacity=".6"/><circle cx="14" cy="-84" r="3.5" fill="#FF9EB5" opacity=".6"/>
          </g>
          <g class="sad">
            <path d="M-11 -90 q3 3 6 0 M5 -90 q3 3 6 0" stroke="#1F1510" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <path d="M-6 -79 q6 -5 12 0" stroke="#1F1510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>

    <!-- HER -->
    <g id="her" class="char">
      <g class="bob">
        <rect x="-9" y="-32" width="6" height="32" rx="3" fill="#8D5A3B"/>
        <rect x="3" y="-32" width="6" height="32" rx="3" fill="#8D5A3B"/>
        <path d="M-14 -72 h28 q2 0 3 3 l11 40 q1 3 -3 3 h-50 q-4 0 -3 -3 l11 -40 q1 -3 3 -3 z" fill="#FFC857"/>
        <path class="loosearm" d="M-12 -64 q-12 14 -9 28" stroke="#8D5A3B" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M12 -64 q12 14 9 28" stroke="#8D5A3B" stroke-width="6" fill="none" stroke-linecap="round"/>
        <g class="head">
          <circle cx="-20" cy="-104" r="12" fill="#2A1B14"/><circle cx="20" cy="-104" r="12" fill="#2A1B14"/>
          <circle cx="0" cy="-90" r="21" fill="#8D5A3B"/>
          <path d="M-20 -95 q1 -20 20 -21 q19 1 20 21 q-9 -11 -20 -10 q-11 -1 -20 10 z" fill="#2A1B14"/>
          <g class="happy">
            <circle cx="-8" cy="-89" r="2.6" fill="#1F1510"/><circle cx="8" cy="-89" r="2.6" fill="#1F1510"/>
            <path d="M-11 -92 l-3 -2 M11 -92 l3 -2" stroke="#1F1510" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M-7 -80 q7 7 14 0" stroke="#1F1510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <circle cx="-14" cy="-82" r="3.5" fill="#FF9EB5" opacity=".7"/><circle cx="14" cy="-82" r="3.5" fill="#FF9EB5" opacity=".7"/>
          </g>
          <g class="sad">
            <path d="M-11 -88 q3 3 6 0 M5 -88 q3 3 6 0" stroke="#1F1510" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <path d="M-6 -77 q6 -4 12 0" stroke="#1F1510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>

    <!-- hug arms overlay (positioned for the hugged pose) -->
    <g class="hugarms" fill="none" stroke-linecap="round">
      <path d="M184 236 q18 6 22 22" stroke="#4A7BD0" stroke-width="8"/>
      <path d="M178 238 q-14 6 -18 20" stroke="#8D5A3B" stroke-width="6"/>
    </g>
  </svg>

  <section class="text" id="text">
    <div class="dots" id="dots"><span class="on"></span><span></span><span></span><span></span><span></span></div>
    <h1 id="title"></h1>
    <p id="body"></p>
    <div class="sig hidden" id="sig">With love, Ano 💛</div>
    <div class="row">
      <button class="ghost hidden" id="back">Back</button>
      <button id="next">Next</button>
    </div>
  </section>
</main>

<script>
  const scenes = [
    { t: "It started at a braai 🔥", b: "Music, smoke in the air, good people… and then there was you, Tumi.", sky: "#FFC9A0", ground: "#C98F6B" },
    { t: "Then came the next day ☀️", b: "We spent the whole day together, and it honestly became one of my favourite days.", sky: "#A9DDF3", ground: "#86C58F" },
    { t: "Then I messed up 🌧️", b: "My friend and I did something that hurt you. That's on me, and I won't make excuses for it.", sky: "#8E97AD", ground: "#6E7C74" },
    { t: "I'm truly sorry 🌷", b: "I'm sorry for how it made you feel. I hope that, in time, you can find it in your heart to forgive me.", sky: "#CFC6E6", ground: "#9DB89A" },
    { t: "And honestly…", b: "I really miss those hugs of yours.", sky: "#FFD6E0", ground: "#A8CFA0" }
  ];
  let i = 0;
  const scene = document.getElementById('scene');
  const sky = document.getElementById('sky');
  const ground = document.getElementById('ground');
  const title = document.getElementById('title');
  const body = document.getElementById('body');
  const sig = document.getElementById('sig');
  const next = document.getElementById('next');
  const back = document.getElementById('back');
  const text = document.getElementById('text');
  const dots = [...document.querySelectorAll('#dots span')];
  const card = document.getElementById('card');

  function render() {
    const s = scenes[i];
    scene.setAttribute('data-s', i + 1);
    scene.classList.remove('hugged');
    sky.setAttribute('fill', s.sky);
    ground.setAttribute('fill', s.ground);
    title.textContent = s.t;
    body.textContent = s.b;
    sig.classList.add('hidden');
    dots.forEach((d, k) => d.classList.toggle('on', k === i));
    back.classList.toggle('hidden', i === 0);
    next.textContent = i === scenes.length - 1 ? "Send a hug 🤗" : "Next";
    text.classList.remove('swap'); void text.offsetWidth; text.classList.add('swap');
  }

  function hearts(n) {
    const icons = ['💗', '💛', '✨', '💕', '🌷'];
    for (let k = 0; k < n; k++) {
      setTimeout(() => {
        const h = document.createElement('span');
        h.className = 'heart';
        h.textContent = icons[k % icons.length];
        h.style.left = (20 + Math.random() * 60) + '%';
        h.style.top = (35 + Math.random() * 20) + '%';
        h.style.setProperty('--dx', (Math.random() * 70 - 35) + 'px');
        card.appendChild(h);
        setTimeout(() => h.remove(), 2900);
      }, k * 160);
    }
  }

  next.addEventListener('click', () => {
    if (i < scenes.length - 1) { i++; render(); return; }
    if (!scene.classList.contains('hugged')) {
      scene.classList.add('hugged');
      setTimeout(() => {
        hearts(14);
        title.textContent = "Missing you 💛";
        body.textContent = "I really miss those hugs of yours.";
        sig.classList.remove('hidden');
        next.textContent = "Watch again";
        text.classList.remove('swap'); void text.offsetWidth; text.classList.add('swap');
      }, 1300);
    } else {
      i = 0; render();
    }
  });
  back.addEventListener('click', () => { if (i > 0) { i--; render(); } });

  render();
</script>
</body>
</html>
